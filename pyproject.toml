[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentping-io"
version = "0.3.0"
description = "Production observability for AI agents: cost attribution, live monitoring, quality scoring."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "AgentPing" }]
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
    "anthropic>=0.30.0,<2.0.0",
    "openai>=1.30.0,<3.0.0",
    "google-genai>=1.0.0,<3.0.0",
    "mistralai>=2.0.0,<3.0.0",
    "cohere>=5.0.0,<6.0.0",
    "pydantic-ai>=1.0.0,<2.0.0",
    "crewai>=1.0.0,<2.0.0",
    "openai-agents>=0.1.0,<2.0.0",
    "llama-index-core>=0.10.0,<2.0.0",
]
anthropic = ["anthropic>=0.30.0,<2.0.0"]
openai = ["openai>=1.30.0,<3.0.0"]
gemini = ["google-genai>=1.0.0,<3.0.0"]
mistral = ["mistralai>=2.0.0,<3.0.0"]
cohere = ["cohere>=5.0.0,<6.0.0"]
bedrock = ["boto3>=1.34.0,<3.0.0"]
pydantic-ai = ["pydantic-ai>=1.0.0,<2.0.0"]
crewai = ["crewai>=1.0.0,<2.0.0"]
openai-agents = ["openai-agents>=0.1.0,<2.0.0"]
langchain = ["langchain-core>=0.3.0,<2.0.0"]
llamaindex = ["llama-index-core>=0.10.0,<2.0.0"]

[project.urls]
Homepage = "https://agentping.io"

[tool.hatch.build.targets.wheel]
packages = ["src/agentping"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
